# Puerta de entrada (decisión 22): la app habla solo con ella; los servicios no se exponen afuera.
#
# Cada servicio se resuelve en cada petición (resolver de Docker + variables). Así, si se
# detiene un servicio, la puerta de entrada sigue funcionando y solo esa sección responde
# "no disponible"; cuando el servicio vuelve, se usa de nuevo sin reiniciar Nginx.
# El servicio de grafo no se publica: solo lo usa el servicio social, por la red interna.

# Límite de intentos por IP para entrar y crear cuentas (además del límite por correo en la base).
limit_req_zone $binary_remote_addr zone=acceso:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 1m;

    proxy_set_header Host $host;
    # La IP la escribe Nginx (no se agrega a la que mande el cliente): nadie puede falsearla para saltarse los límites.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_intercept_errors off;

    location = /salud {
        default_type application/json;
        return 200 '{"estado": "ok", "servicio": "puerta de entrada"}';
    }

    location ~ ^/api/social/(v1/sesiones|v1/cuentas)$ {
        limit_req zone=acceso burst=5 nodelay;
        include /etc/nginx/snippets/seguridad.conf;
        set $ruta $1;
        proxy_pass http://social:8000/$ruta$is_args$args;
        error_page 502 503 504 = @no_disponible;
    }

    # Foto de perfil: el único lugar que acepta hasta 3 MB (el servicio rechaza más de 2 MB con un mensaje claro).
    location = /api/social/v1/yo/foto {
        client_max_body_size 3m;
        include /etc/nginx/snippets/seguridad.conf;
        set $servicio social;   # variable: se resuelve en cada petición (Nginx arranca aunque social esté caído)
        proxy_pass http://$servicio:8000/v1/yo/foto;
        error_page 502 503 504 = @no_disponible;
    }

    # La documentación automática de FastAPI (/docs, /redoc, /openapi.json) no se publica: daría el mapa completo
    # de la API a cualquiera (auditoría MS-02). Sigue disponible dentro de la red de Docker para desarrollo.
    location ~ ^/api/[^/]+/(docs|redoc|openapi\.json)(/.*)?$ {
        default_type application/json;
        return 404 '{"error": {"codigo": "no_encontrado", "mensaje": "No existe esa ruta."}}';
    }

    location ~ ^/api/(social|verificacion|temas|oficial)/(.*)$ {
        include /etc/nginx/snippets/seguridad.conf;
        set $servicio $1;
        set $ruta $2;
        proxy_pass http://$servicio:8000/$ruta$is_args$args;
        error_page 502 503 504 = @no_disponible;
    }

    location @no_disponible {
        default_type application/json;
        return 503 '{"error": {"codigo": "servicio_no_disponible", "mensaje": "Esta parte de la aplicación no está disponible en este momento. El resto sigue funcionando."}}';
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error": {"codigo": "no_encontrado", "mensaje": "No existe esa ruta."}}';
    }

    # La app web (React). Las rutas de la app (/temas, /datos/...) vuelven a index.html.
    root /usr/share/nginx/html;
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache";
    }
}
