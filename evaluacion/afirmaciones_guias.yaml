    requiere: [{valor: "5.9", consejo: variante_no_dicha, con_fuente: true}]
  por_que: "No dice si es la variación anual, mensual o año corrido."
- n: 3
  texto: "Los homicidios subieron 12 % en septiembre de 2026 frente a septiembre de 2025."
