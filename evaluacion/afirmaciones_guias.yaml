# Conjunto de guías (decisión 34): 15 frases NUEVAS, escritas el 22 nov 2026 ANTES de correrlas. Miden que
# cada análisis traiga la guía correcta (el consejo del motivo o de la trampa y la fuente oficial para
# comprobarlo) y que ninguna guía redactada por la IA lleve cifras ni juicios (esa revisión se hace siempre).
# Datos oficiales de referencia ese día: desempleo ago 2026 9,36 · sep 2026 8,02; inflación anual ago 2026
# 6,24, mensual jul 2026 0,17, mensual ago 2026 0,39; homicidios: último mes aceptado, sep 2026.
- n: 1
  texto: "En Cali el desempleo llegó a 11 % en agosto de 2026."
  categoria: sin_serie
  esperado:
    requiere: [{valor: "11", consejo: territorio_no_nacional, con_fuente: true}]
  por_que: "Solo hay series nacionales; la guía debe explicar por qué y llevar a la tabla por ciudades del DANE."
- n: 2
  texto: "La inflación fue de 5,9 % en agosto de 2026."
