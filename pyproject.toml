[project]
name = "app"
version = "0.1.0"
description = "Official data behind public claims in Colombia"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "certifi>=2024.2.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.165.0",
    "httpx>=0.27",
    "neo4j>=6.4.1",
    "openpyxl>=3.1",
    "pdfminer-six>=20231228",
    "pillow>=12.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0",
]

[dependency-groups]
dev = [
    "cryptography>=42",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/servicios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real APIs; also used as the daily connector health check (run with -m live)",
]
addopts = "-m 'not live'"
